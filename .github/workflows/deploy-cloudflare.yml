name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm 10.x (the default bundled with Node 22 here) fails "npm ci" on this lockfile's Cloudflare
      # workerd/miniflare optional-platform-dependency shape, flagging already-satisfied packages as
      # missing. npm 11 validates the same lockfile correctly (verified locally against this exact commit).
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
